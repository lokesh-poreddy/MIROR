name: MIROR Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: miror-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: V13 production contract
        run: python3 tools/validate-v13-production.py

      - name: TypeScript validation
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
